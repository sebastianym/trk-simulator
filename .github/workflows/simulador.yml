name: Simulador diario TRK

on:
  schedule:
    # 23:30 UTC = 18:30 en Bogotá, de lunes a viernes.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar = solo prueba credenciales | ejecutar = aplica los días pendientes"
        type: choice
        options: [verificar, ejecutar]
        default: verificar
      hasta_dia:
        description: "Solo modo demo: avanzar hasta este día del sprint (1 a 9). Vacío = según la fecha."
        required: false

permissions:
  contents: write

concurrency:
  group: simulador
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    env:
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Verificar credenciales
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'verificar'
        run: python simulate_day.py --check

      - name: Ejecutar actividad del día
        if: github.event_name == 'schedule' || inputs.modo == 'ejecutar'
        run: |
          if [ -n "${{ inputs.hasta_dia }}" ]; then
            python simulate_day.py --until-day "${{ inputs.hasta_dia }}"
          else
            python simulate_day.py
          fi

      - name: Guardar avance en state.json
        if: always() && (github.event_name == 'schedule' || inputs.modo == 'ejecutar')
        run: |
          git config user.name "trk-simulator"
          git config user.email "simulator@example.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "estado: $(TZ=America/Bogota date +%F)" && git push)
